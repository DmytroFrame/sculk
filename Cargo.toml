[package]
name = "sculk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Distributed Minecraft: Java Edition server. One binary, three roles: io, worker, anvildb"

[[bin]]
name = "sculk"
path = "src/main.rs"

[dependencies]
sculk-io = { path = "crates/sculk-io" }
sculk-worker = { path = "crates/sculk-worker" }
sculk-anvildb = { path = "crates/sculk-anvildb" }
sculk-data = { path = "crates/sculk-data" }
sculk-tunnel = { path = "crates/sculk-tunnel" }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[workspace]
members = ["crates/*"]
# Horizon is a reference clone with its own workspace.
exclude = ["external"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Dmytro Kostyshyn <dimakostishen@gmail.com>", "Claude (Anthropic) <noreply@anthropic.com>"]

[workspace.dependencies]
anyhow = "1.0.104"
# Horizon (MIT) is Sculk's base: external/horizon is upstream at patches/horizon/BASE plus Sculk's patches
# (tools/horizon.sh setup).
horizon-client = { path = "external/horizon/crates/horizon-client", default-features = false }
horizon-core = { path = "external/horizon/crates/horizon-core" }
horizon-hooks = { path = "external/horizon/crates/horizon-hooks" }
horizon-threads = { path = "external/horizon/crates/horizon-threads" }
horizon-mods = { path = "external/horizon/crates/horizon-mods", default-features = false, features = ["index"] }
horizon-protocol = { path = "external/horizon/crates/horizon-protocol" }
horizon-world = { path = "external/horizon/crates/horizon-world" }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4.3"
md-5 = "0.11.0"
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.5.1"
uuid = "1.29.2"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

# As Horizon's: the engine is the vanilla game and needs optimizing to hold 20 TPS.
[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick to link, for running the engine while developing: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Horizon's own dependency patches (external/horizon/Cargo.toml, THIRD_PARTY_NOTICES.md), so the engine builds as
# Horizon's releases do: cargo applies [patch] only from the workspace being built.
[patch.crates-io]
wgpu-hal = { path = "external/horizon/third_party/wgpu-hal" }
naga = { path = "external/horizon/third_party/naga" }
libmimalloc-sys = { path = "external/horizon/third_party/libmimalloc-sys" }
