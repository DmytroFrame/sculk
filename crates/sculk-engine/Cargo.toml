[package]
name = "sculk-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A worker's game engine: Horizon's dedicated server with Sculk's hooks (chunks in AnvilDB under leases)"

[[bin]]
name = "sculk-engine"
path = "src/main.rs"

[dependencies]
sculk-proto = { path = "../sculk-proto" }
horizon-client.workspace = true
horizon-hooks.workspace = true
horizon-mods.workspace = true
horizon-threads.workspace = true
anyhow.workspace = true
tokio.workspace = true
tonic.workspace = true
# Horizon logs through `log`; the engine's lines go to its log with them.
log = "0.4"

[dev-dependencies]
tempfile.workspace = true
