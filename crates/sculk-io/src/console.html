<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sculk console</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --text: #e6e8ee; --dim: #8b91a1; --line: #262a34; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --panel: #fff; --text: #1b1e25; --dim: #646b7b; --line: #e1e4ea; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .dim { color: var(--dim); }
  main { display: grid; grid-template-columns: 1fr 340px; height: calc(100vh - 48px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #map { height: 60vh; } }
  #map { width: 100%; height: 100%; display: block; cursor: grab; background: var(--bg); }
  aside { border-left: 1px solid var(--line); overflow: auto; padding: 12px 16px; background: var(--panel); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 14px 0 6px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
</style>
</head>
<body>
<header>
  <h1>Sculk</h1>
  <span class="dim" id="summary">…</span>
  <label class="dim">dimension <select id="dimension"></select></label>
  <span class="dim">drag to pan, wheel to zoom</span>
</header>
<main>
  <canvas id="map"></canvas>
  <aside>
    <h2>Workers</h2>
    <table id="workers"><thead><tr><th>worker</th><th>players</th><th>MSPT</th><th>chunks</th></tr></thead><tbody></tbody></table>
    <h2>Players</h2>
    <table id="players"><thead><tr><th>name</th><th>worker</th><th>where</th></tr></thead><tbody></tbody></table>
  </aside>
</main>
<script>
const canvas = document.getElementById('map'), ctx = canvas.getContext('2d');
const select = document.getElementById('dimension');
let state = { workers: [], players: [], chunks: [] };
let view = { x: 0, z: 0, scale: 4 }; // centre in chunks, pixels per chunk
const colour = id => `hsl(${(id * 137.5) % 360} 65% 55%)`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight, dpr = devicePixelRatio || 1;
  canvas.width = w * dpr; canvas.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const dim = select.value, s = view.scale;
  const sx = x => w / 2 + (x - view.x) * s, sz = z => h / 2 + (z - view.z) * s;
  for (const [worker, d, x, z] of state.chunks) {
    if (d !== dim) continue;
    ctx.fillStyle = colour(worker);
    ctx.fillRect(sx(x), sz(z), Math.max(s - (s > 3 ? 1 : 0), 1), Math.max(s - (s > 3 ? 1 : 0), 1));
  }
  ctx.font = '12px system-ui'; ctx.textBaseline = 'middle';
  for (const p of state.players) {
    if (!p.position || p.dimension !== dim) continue;
    const px = sx(p.position[0] / 16), pz = sz(p.position[2] / 16);
    ctx.fillStyle = getComputedStyle(document.body).color;
    ctx.beginPath(); ctx.arc(px, pz, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillText(p.name, px + 7, pz);
  }
}

async function refresh() {
  try {
    state = await (await fetch('/api/state')).json();
  } catch { return; }
  const dims = [...new Set([...state.chunks.map(c => c[1]), ...state.players.map(p => p.dimension).filter(Boolean), 'minecraft:overworld'])];
  if (dims.join() !== [...select.options].map(o => o.value).join()) {
    const keep = select.value;
    select.innerHTML = dims.map(d => `<option>${esc(d)}</option>`).join('');
    if (dims.includes(keep)) select.value = keep;
  }
  const counts = {};
  for (const [worker] of state.chunks) counts[worker] = (counts[worker] || 0) + 1;
  document.querySelector('#workers tbody').innerHTML = state.workers.map(w =>
    `<tr><td><span class="swatch" style="background:${colour(w.id)}"></span>#${w.id}${w.engine ? '' : ' (flat)'}</td>` +
    `<td>${w.players}</td><td>${w.mspt.toFixed(1)}</td><td>${counts[w.id] || 0}</td></tr>`).join('');
  document.querySelector('#players tbody').innerHTML = state.players.map(p =>
    `<tr><td>${esc(p.name)}</td><td>#${p.worker}</td><td>${p.position ? p.position.map(v => Math.round(v)).join(', ') : '—'}</td></tr>`).join('');
  document.getElementById('summary').textContent =
    `${state.world} · ${state.workers.length} workers · ${state.players.length} players · ${state.chunks.length} leased chunks`;
  draw();
}

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, z: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  view.x -= (e.clientX - drag.x) / view.scale; view.z -= (e.clientY - drag.z) / view.scale;
  drag = { x: e.clientX, z: e.clientY }; draw();
});
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  view.scale = Math.min(32, Math.max(0.25, view.scale * (e.deltaY < 0 ? 1.25 : 0.8))); draw();
}, { passive: false });
canvas.addEventListener('dblclick', () => {
  const p = state.players.find(p => p.position && p.dimension === select.value);
  if (p) { view.x = p.position[0] / 16; view.z = p.position[2] / 16; draw(); }
});
select.addEventListener('change', draw);
addEventListener('resize', draw);
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
