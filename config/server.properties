# The cluster's game settings: every worker's engine takes these keys (SCULK_PROPERTIES), so all of them play by the
# same rules. Keys are vanilla's server.properties. Sculk sets online-mode, server-ip, server-port, level-seed and
# max-players itself (IO checks players and counts them against SCULK_MAX_PLAYERS).
gamemode=survival
difficulty=easy
pvp=true
hardcore=false
spawn-protection=16
allow-flight=false
white-list=false
view-distance=10
simulation-distance=10
online-mode=false
